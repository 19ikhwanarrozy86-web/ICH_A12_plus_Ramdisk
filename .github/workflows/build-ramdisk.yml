      - name: Package artifact
        run: |
          set -e
          BOOTCHAIN_DIR=$(find bootchain -maxdepth 1 -type d | tail -n +2 | head -1)
          if [[ -z "$BOOTCHAIN_DIR" ]]; then
            echo "ERROR: No bootchain directory found" >&2
            exit 1
          fi
          
          mkdir -p artifact/
          echo "=== Menyalin Berkas Utama dengan Nama Lengkap (Tanpa Singkatan) ==="
          
          if [[ -f "$BOOTCHAIN_DIR/iBoot.patched.bin" ]]; then
            cp "$BOOTCHAIN_DIR/iBoot.patched.bin" artifact/iBoot.patched.bin
            echo "[+] Sukses: iBoot.patched.bin"
          else
            echo "[-] ERROR: iBoot.patched.bin tidak ditemukan!" >&2
            exit 1
          fi
          
          if [[ -f "$BOOTCHAIN_DIR/devicetree.img4" ]]; then
            cp "$BOOTCHAIN_DIR/devicetree.img4" artifact/devicetree.img4
            echo "[+] Sukses: devicetree.img4"
          else
            echo "[-] ERROR: devicetree.img4 tidak ditemukan!" >&2
            exit 1
          fi
          
          if [[ -f "$BOOTCHAIN_DIR/ramdisk.img4" ]]; then
            cp "$BOOTCHAIN_DIR/ramdisk.img4" artifact/ramdisk.img4
            echo "[+] Sukses: ramdisk.img4"
          else
            echo "[-] ERROR: ramdisk.img4 tidak ditemukan!" >&2
            exit 1
          fi
          
          if [[ -f "$BOOTCHAIN_DIR/kernelcache.img4.patched" ]]; then
            cp "$BOOTCHAIN_DIR/kernelcache.img4.patched" artifact/kernelcache.img4
            echo "[+] Sukses: kernelcache.img4 (patched)"
          elif [[ -f "$BOOTCHAIN_DIR/kernelcache.img4.stock" ]]; then
            cp "$BOOTCHAIN_DIR/kernelcache.img4.stock" artifact/kernelcache.img4
            echo "[+] Sukses: kernelcache.img4 (stock)"
          else
            echo "[-] ERROR: kernelcache tidak ditemukan!" >&2
            exit 1
          fi
          
          echo "=== Menyalin Semua Berkas Firmware Coprocessor Lengkap ==="
          for extra_file in PMP.img4 WCH.img4 ANE.img4 AOP.img4 AVE.img4 GFX.img4 ISP.img4 SIO.img4 trustcache.img4 sep-firmware.img4 logo.img4; do
            if [[ -f "$BOOTCHAIN_DIR/$extra_file" ]]; then
              cp "$BOOTCHAIN_DIR/$extra_file" artifact/
              echo "[+] Sukses Menyalin Ekstra: $extra_file"
            fi
          done
          
          cat > artifact/BUILD-INFO.txt << EOF
          Device: iPhone 11 (A13)
          Build: ${{ github.event.inputs.ios_version }}
          Status: Standard Full Named Files for OkeRamdisk Tool
          EOF
          
          tar -czf iphone11-a13-ramdisk.tar.gz -C artifact .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iphone11-a13-ramdisk-${{ github.event.inputs.ios_version }}
          path: |
            artifact/
            iphone11-a13-ramdisk.tar.gz
          if-no-files-found: error

      - name: Restore original files
        if: always()
        run: |
          if [[ -f tools/darwin/irecovery.stock ]]; then
            mv -f tools/darwin/irecovery.stock tools/darwin/irecovery
            echo "Restored original irecovery"
          fi
