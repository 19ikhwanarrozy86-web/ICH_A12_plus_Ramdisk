      - name: Package artifact
        run: |
          set -e
          BOOTCHAIN_DIR=$(find bootchain -maxdepth 1 -type d | tail -n +2 | head -1)
          if [[ -z "$BOOTCHAIN_DIR" ]]; then
            echo "ERROR: No bootchain directory found" >&2
            exit 1
          fi
          
          # Membuat folder bersih untuk hasil akhir
          mkdir -p artifact/
          
          echo "=== Menyalin & Otomatis Mengubah Nama 4 File Utama Ramdisk ==="
          
          # 1. Mengambil iBoot Patched dan diubah menjadi ib.bin
          if [[ -f "$BOOTCHAIN_DIR/iBoot.patched.bin" ]]; then
            cp "$BOOTCHAIN_DIR/iBoot.patched.bin" artifact/ib.bin
            echo "[+] Sukses: iBoot -> ib.bin"
          else
            echo "[-] ERROR: iBoot.patched.bin tidak ditemukan!" >&2
            exit 1
          fi
          
          # 2. Mengambil DeviceTree dan diubah menjadi dt.img4
          if [[ -f "$BOOTCHAIN_DIR/devicetree.img4" ]]; then
            cp "$BOOTCHAIN_DIR/devicetree.img4" artifact/dt.img4
            echo "[+] Sukses: devicetree -> dt.img4"
          else
            echo "[-] ERROR: devicetree.img4 tidak ditemukan!" >&2
            exit 1
          fi
          
          # 3. Mengambil Ramdisk dan diubah menjadi rd.img4
          if [[ -f "$BOOTCHAIN_DIR/ramdisk.img4" ]]; then
            cp "$BOOTCHAIN_DIR/ramdisk.img4" artifact/rd.img4
            echo "[+] Sukses: ramdisk -> rd.img4"
          else
            echo "[-] ERROR: ramdisk.img4 tidak ditemukan!" >&2
            exit 1
          fi
          
          # 4. Mengambil Kernelcache Patched dan diubah menjadi kc.img4
          if [[ -f "$BOOTCHAIN_DIR/kernelcache.img4.patched" ]]; then
            cp "$BOOTCHAIN_DIR/kernelcache.img4.patched" artifact/kc.img4
            echo "[+] Sukses: kernelcache.patched -> kc.img4"
          elif [[ -f "$BOOTCHAIN_DIR/kernelcache.img4.stock" ]]; then
            cp "$BOOTCHAIN_DIR/kernelcache.img4.stock" artifact/kc.img4
            echo "[+] Sukses: kernelcache.stock -> kc.img4"
          else
            echo "[-] ERROR: kernelcache tidak ditemukan!" >&2
            exit 1
          fi
          
          # Membuat catatan ringkas info build
          cat > artifact/BUILD-INFO.txt << EOF
          Device: iPhone 11 (A13)
          Build: ${{ github.event.inputs.ios_version }}
          Status: Cleaned & Renamed for OkeRamdisk Tool
          Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          
          # Mengompres folder artifact menjadi file .tar.gz yang sangat kecil
          tar -czf iphone11-a13-ramdisk.tar.gz -C artifact .
          
          echo "=== RINGKASAN FILE FINAL DI DALAM ARTIFACT ==="
          find artifact -type f
          du -ah iphone11-a13-ramdisk.tar.gz
