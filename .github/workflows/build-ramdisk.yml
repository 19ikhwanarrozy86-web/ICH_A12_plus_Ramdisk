name: Build iPhone 11 A13 Ramdisk

on:
  workflow_dispatch:
    inputs:
      ios_version:
        description: 'iOS version or Build ID (e.g. 26.5.2 or 23F84)'
        required: true
        default: '23F84'
        type: string
      kernel:
        description: 'Kernel patch mode'
        required: true
        default: 'patched'
        type: choice
        options:
          - patched
          - stock
      with_fw:
        description: 'Include coprocessor firmware (AOP/ANE/AVE/ISP/GFX/SIO/PMP)'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "=== macOS Version ==="
          sw_vers
          echo "=== Architecture ==="
          uname -m
          echo "=== PATH ==="
          tr ':' '\n' <<< "$PATH"

      - name: Install system dependencies
        run: |
          set -e
          brew update
          brew install ipsw curl python@3
          which ipsw || { echo "FAIL: ipsw not installed" >&2; exit 1; }
          which python3 || { echo "FAIL: python3 not installed" >&2; exit 1; }
          echo "OK: ipsw $(ipsw version 2>/dev/null | head -1)"

      - name: Setup Python venv
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          else
            echo "WARNING: requirements.txt missing, installing known deps"
            python -m pip install pyimg4 capstone pillow
          fi
          python -c "import pyimg4, capstone; print('OK: pyimg4 + capstone')"
          echo "VENV_PYTHON=$(pwd)/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Verify repository structure
        run: |
          set -e
          for f in build.sh env.sh scripts/devices.sh scripts/ramdisk_expand.sh patch/iboot_patchfinder.py patch/apply_kernel_patches.py patch/finalize_iboot.py patch/preflight.py; do
            [[ -f "$f" ]] || { echo "MISS: $f" >&2; exit 1; }
            echo "OK: $f"
          done
          for r in resources/IM4M_0x8030 resources/ssh.tar.gz resources/sshtarlist.txt; do
            [[ -f "$r" ]] || { echo "MISS: $r" >&2; exit 1; }
            echo "OK: $r"
          done
          chmod +x tools/darwin/*
          for t in pzb img4 gtar trustcache jq; do
            [[ -x "tools/darwin/$t" ]] || { echo "MISS: tool $t" >&2; exit 1; }
            echo "OK: tool: $t"
          done

      - name: Patch build.sh for case-insensitive DeviceClass
        run: |
          set -e
          cp build.sh build.sh.bak
          python3 << 'PY'
          import sys
          with open('build.sh', 'r') as f:
              content = f.read()
          orig = 'if item.get("Info", {}).get("DeviceClass") == board'
          repl = 'if item.get("Info", {}).get("DeviceClass", "").lower() == board.lower()'
          if orig not in content:
              print("WARNING: original pattern not found; build.sh may already be patched or changed")
              sys.exit(0)
          content = content.replace(orig, repl)
          with open('build.sh', 'w') as f:
              f.write(content)
          print("Patched build.sh: case-insensitive DeviceClass matching")
          PY
          diff -u build.sh.bak build.sh || true

      - name: Patch env.sh so a CI venv actually gets used
        run: |
          set -e
          cp env.sh env.sh.bak
          python3 << 'PY'
          with open('env.sh', 'r') as f:
              content = f.read()
          orig = 'export PATH="/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin:/usr/local/bin:$NR_TOOLS${PATH:+:$PATH}"'
          repl = 'export PATH="${VIRTUAL_ENV:+$VIRTUAL_ENV/bin:}/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin:/usr/local/bin:$NR_TOOLS${PATH:+:$PATH}"'
          if orig not in content:
              print("WARNING: env.sh PATH line not found as expected; leaving untouched")
          else:
              content = content.replace(orig, repl)
              with open('env.sh', 'w') as f:
                  f.write(content)
              print("Patched env.sh: python3 now prefers an active venv over system python3")
          PY
          diff -u env.sh.bak env.sh || true

      - name: Replace irecovery with CI shim
        run: |
          set -e
          mv tools/darwin/irecovery tools/darwin/irecovery.stock
          cat > tools/darwin/irecovery << 'SHIM'
          #!/bin/bash
          if [[ "$1" == "-q" ]]; then
            cat << 'INNER'
          PRODUCT: iPhone12,1
          MODEL: N104AP
          CPID: 0x8030
          MODE: DFU
          PWND: usbliter8
          ECID: 0000000000000000
          NAME: iPhone 11
          INNER
          else
            echo "irecovery shim: unsupported args: $@" >&2
            exit 1
          fi
          SHIM
          chmod +x tools/darwin/irecovery
          echo "=== Shim test (via absolute path) ==="
          tools/darwin/irecovery -q

      - name: Pre-build debug — inspect BuildManifest
        run: |
          set +e
          source .venv/bin/activate
          mkdir -p /tmp/bm_debug
          cd /tmp/bm_debug
          echo "=== Downloading BuildManifest via ipsw CLI ==="
          ipsw download ipsw --device iPhone12,1 --build "${{ github.event.inputs.ios_version }}" --build-manifest --output .
          if [[ -f BuildManifest.plist ]]; then
            python3 << 'PY'
          import plistlib
          try:
              manifest = plistlib.loads(open("BuildManifest.plist", "rb").read())
              identities = manifest.get("BuildIdentities", [])
              print("=== BUILD IDENTITIES ===")
              for i, ident in enumerate(identities):
                  info = ident.get("Info", {})
                  print(f"Index {i}: DeviceClass={info.get('DeviceClass','N/A')} ProductType={info.get('ProductType','N/A')} BoardConfig={info.get('BoardConfig','N/A')} BuildNumber={info.get('BuildNumber','N/A')} RestoreBehavior={info.get('RestoreBehavior','N/A')}")
          except Exception as e:
              print(f"Failed to parse BuildManifest: {e}")
          PY
          else
            echo "WARNING: Could not download BuildManifest for debug inspection"
          fi
          cd -

      - name: Build bootchain
        run: |
          set -e
          source .venv/bin/activate
          export PATH="$(pwd)/.venv/bin:$PATH"

          ARGS="--build ${{ github.event.inputs.ios_version }}"
          ARGS="$ARGS --kernel ${{ github.event.inputs.kernel }}"
          if [[ "${{ github.event.inputs.with_fw }}" == "true" ]]; then
            ARGS="$ARGS --with-fw"
          else
            ARGS="$ARGS --no-fw"
          fi
          
          echo "=== SELECTED BUILD IDENTITY ==="
          echo "Device: iPhone 11 (iPhone12,1 / N104AP / 0x8030)"
          echo "Build:  ${{ github.event.inputs.ios_version }}"
          echo "Kernel: ${{ github.event.inputs.kernel }}"
          echo "With-FW: ${{ github.event.inputs.with_fw }}"
          echo "==========================="
          ./build.sh $ARGS --kpf-set ios26

      - name: Inspect bootchain
        run: |
          set -e
          echo "=== Bootchain files ==="
          find bootchain -type f -print
          echo "=== Bootchain sizes ==="
          du -ah bootchain
          echo "=== chain.info ==="
          cat bootchain/*/chain.info || true

       - name: Package artifact
        run: |
          set -e
          BOOTCHAIN_DIR=$(find bootchain -maxdepth 1 -type d | tail -n +2 | head -1)
          if [[ -z "$BOOTCHAIN_DIR" ]]; then
            echo "ERROR: No bootchain directory found" >&2
            exit 1
          fi
          
          # Membuat folder bersih untuk hasil akhir
          mkdir -p artifact/
          
          echo "=== Menyalin & Otomatis Mengubah Nama 4 File Utama Ramdisk ==="
          
          # 1. Mengambil iBoot Patched dan diubah menjadi ib.bin
          if [[ -f "$BOOTCHAIN_DIR/iBoot.patched.bin" ]]; then
            cp "$BOOTCHAIN_DIR/iBoot.patched.bin" artifact/ib.bin
            echo "[+] Sukses: iBoot -> ib.bin"
          else
            echo "[-] ERROR: iBoot.patched.bin tidak ditemukan!" >&2
            exit 1
          fi
          
          # 2. Mengambil DeviceTree dan diubah menjadi dt.img4
          if [[ -f "$BOOTCHAIN_DIR/devicetree.img4" ]]; then
            cp "$BOOTCHAIN_DIR/devicetree.img4" artifact/dt.img4
            echo "[+] Sukses: devicetree -> dt.img4"
          else
            echo "[-] ERROR: devicetree.img4 tidak ditemukan!" >&2
            exit 1
          fi
          
          # 3. Mengambil Ramdisk dan diubah menjadi rd.img4
          if [[ -f "$BOOTCHAIN_DIR/ramdisk.img4" ]]; then
            cp "$BOOTCHAIN_DIR/ramdisk.img4" artifact/rd.img4
            echo "[+] Sukses: ramdisk -> rd.img4"
          else
            echo "[-] ERROR: ramdisk.img4 tidak ditemukan!" >&2
            exit 1
          fi
          
          # 4. Mengambil Kernelcache Patched dan diubah menjadi kc.img4
          if [[ -f "$BOOTCHAIN_DIR/kernelcache.img4.patched" ]]; then
            cp "$BOOTCHAIN_DIR/kernelcache.img4.patched" artifact/kc.img4
            echo "[+] Sukses: kernelcache.patched -> kc.img4"
          elif [[ -f "$BOOTCHAIN_DIR/kernelcache.img4.stock" ]]; then
            cp "$BOOTCHAIN_DIR/kernelcache.img4.stock" artifact/kc.img4
            echo "[+] Sukses: kernelcache.stock -> kc.img4"
          else
            echo "[-] ERROR: kernelcache tidak ditemukan!" >&2
            exit 1
          fi
          
          # Membuat catatan ringkas info build
          cat > artifact/BUILD-INFO.txt << EOF
          Device: iPhone 11 (A13)
          Build: ${{ github.event.inputs.ios_version }}
          Status: Cleaned & Renamed for OkeRamdisk Tool
          Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          
          # Mengompres folder artifact menjadi file .tar.gz yang sangat kecil
          tar -czf iphone11-a13-ramdisk.tar.gz -C artifact .
          
          echo "=== RINGKASAN FILE FINAL DI DALAM ARTIFACT ==="
          find artifact -type f
          du -ah iphone11-a13-ramdisk.tar.gz


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iphone11-a13-ramdisk-${{ github.event.inputs.ios_version }}
          path: |
            artifact/
            iphone11-a13-ramdisk.tar.gz
          if-no-files-found: error

      - name: Restore original files
        if: always()
        run: |
          if [[ -f tools/darwin/irecovery.stock ]]; then
            mv -f tools/darwin/irecovery.stock tools/darwin/irecovery
            echo "Restored original irecovery"
          fi
          
          # Eksekusi restorasi aman menggunakan JavaScript Node.js
          node -e '
          const { execSync } = require("child_process");
          const fs = require("fs");
          
          const script = `
          if [[ -f build.sh.bak ]]; then
            mv -f build.sh.bak build.sh
            echo "Restored original build.sh"
          fi
          if [[ -f env.sh.bak ]]; then
            mv -f env.sh.bak env.sh
            echo "Restored original env.sh"
          fi
          `;
          
          try {
            console.log("=== Menjalankan Restorasi File via JavaScript ===");
            execSync(script, { shell: "/bin/bash", stdio: "inherit" });
          } catch (error) {
            console.error("Gagal merestorasi file:", error.message);
            process.exit(1);
          }
          '
