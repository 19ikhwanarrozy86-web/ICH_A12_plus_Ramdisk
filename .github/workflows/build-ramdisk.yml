name: Build A12/A13 iPhone Ramdisk

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device'
        required: true
        default: 'iPhone 11'
        type: choice
        options:
          - iPhone XS
          - iPhone XS Max
          - iPhone XR
          - iPhone 11
          - iPhone 11 Pro
          - iPhone 11 Pro Max
      ios_version:
        description: 'iOS version or Build ID (e.g. 26.5.2 or 23F84). Ignored when direct_ipsw_url is set.'
        required: true
        default: '23F84'
        type: string
      direct_ipsw_url:
        description: 'Direct Apple .ipsw URL. Bypasses build.sh internal api.ipsw.me lookup — use this when a build is too new for ipsw.me to have indexed yet (common for an RC/beta released in the last week or two) even though the IPSW itself is already live on Apple CDN.'
        required: false
        default: ''
        type: string
      kernel:
        description: 'Kernel patch mode'
        required: true
        default: 'patched'
        type: choice
        options:
          - patched
          - stock
      kpf_set:
        description: 'Kernel patchfinder set passed to build.sh --kpf-set. auto only resolves correctly when build.sh knows the real iOS version (i.e. via ios_version); with direct_ipsw_url, build.sh sets VERSION=unknown and auto silently falls back to ios18 — fine for an 18.x/26.x non-TXM target like this one, but override explicitly for a 27+/TXM target.'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - ios17
          - ios18
          - ios26
          - ios27
          - debugger+amfi
          - all
      with_fw:
        description: 'Include coprocessor firmware (AOP/ANE/AVE/ISP/GFX/SIO/PMP)'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve device identity
        # Single source of truth for device → (ProductType, BoardConfig, CPID) so
        # every later step (irecovery shim, ipsw --device, BUILD-INFO.txt, artifact
        # name) stays in sync automatically instead of re-hardcoding iPhone 11 in
        # five different places. CPIDs/BoardConfigs cross-checked against
        # theapplewiki.com / ipsw.me. iPhone XS Max defaults to the global
        # iPhone11,6/D331pAP identity; swap in iPhone11,4/D331AP below if you
        # specifically need the mainland-China dual-SIM variant.
        run: |
          set -e
          case "${{ github.event.inputs.device }}" in
            "iPhone XS")
              DEVICE_PRODUCT="iPhone11,2"; DEVICE_BOARD="D321AP"
              DEVICE_CPID="0x8020"; DEVICE_CHIP="A12 / T8020"; DEVICE_SLUG="iphone-xs" ;;
            "iPhone XS Max")
              DEVICE_PRODUCT="iPhone11,6"; DEVICE_BOARD="D331pAP"
              DEVICE_CPID="0x8020"; DEVICE_CHIP="A12 / T8020"; DEVICE_SLUG="iphone-xs-max" ;;
            "iPhone XR")
              DEVICE_PRODUCT="iPhone11,8"; DEVICE_BOARD="N841AP"
              DEVICE_CPID="0x8020"; DEVICE_CHIP="A12 / T8020"; DEVICE_SLUG="iphone-xr" ;;
            "iPhone 11")
              DEVICE_PRODUCT="iPhone12,1"; DEVICE_BOARD="N104AP"
              DEVICE_CPID="0x8030"; DEVICE_CHIP="A13 / T8030"; DEVICE_SLUG="iphone-11" ;;
            "iPhone 11 Pro")
              DEVICE_PRODUCT="iPhone12,3"; DEVICE_BOARD="D421AP"
              DEVICE_CPID="0x8030"; DEVICE_CHIP="A13 / T8030"; DEVICE_SLUG="iphone-11-pro" ;;
            "iPhone 11 Pro Max")
              DEVICE_PRODUCT="iPhone12,5"; DEVICE_BOARD="D431AP"
              DEVICE_CPID="0x8030"; DEVICE_CHIP="A13 / T8030"; DEVICE_SLUG="iphone-11-pro-max" ;;
            *)
              echo "ERROR: unknown device '${{ github.event.inputs.device }}'" >&2
              exit 1 ;;
          esac
          DEVICE_NAME="${{ github.event.inputs.device }}"
          {
            echo "DEVICE_PRODUCT=$DEVICE_PRODUCT"
            echo "DEVICE_BOARD=$DEVICE_BOARD"
            echo "DEVICE_CPID=$DEVICE_CPID"
            echo "DEVICE_CHIP=$DEVICE_CHIP"
            echo "DEVICE_SLUG=$DEVICE_SLUG"
            echo "DEVICE_NAME=$DEVICE_NAME"
          } >> "$GITHUB_ENV"
          echo "=== Resolved device ==="
          echo "Name:    $DEVICE_NAME"
          echo "Product: $DEVICE_PRODUCT"
          echo "Board:   $DEVICE_BOARD"
          echo "CPID:    $DEVICE_CPID"
          echo "Chip:    $DEVICE_CHIP"

      - name: Show environment
        run: |
          echo "=== macOS Version ==="
          sw_vers
          echo "=== Architecture ==="
          uname -m
          echo "=== PATH ==="
          tr ':' '\n' <<< "$PATH"

      - name: Install system dependencies
        run: |
          set -e
          brew update
          brew install ipsw curl python@3
          which ipsw || { echo "FAIL: ipsw not installed" >&2; exit 1; }
          which python3 || { echo "FAIL: python3 not installed" >&2; exit 1; }
          echo "OK: ipsw $(ipsw version 2>/dev/null | head -1)"

      - name: Setup Python venv
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          else
            echo "WARNING: requirements.txt missing, installing known deps"
            python -m pip install pyimg4 capstone pillow
          fi
          python -c "import pyimg4, capstone; print('OK: pyimg4 + capstone')"
          echo "VENV_PYTHON=$(pwd)/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Verify repository structure
        run: |
          set -e
          for f in build.sh env.sh scripts/devices.sh scripts/ramdisk_expand.sh patch/iboot_patchfinder.py patch/apply_kernel_patches.py patch/finalize_iboot.py patch/preflight.py; do
            [[ -f "$f" ]] || { echo "MISS: $f" >&2; exit 1; }
            echo "OK: $f"
          done
          for r in "resources/IM4M_${DEVICE_CPID}" resources/ssh.tar.gz resources/sshtarlist.txt; do
            [[ -f "$r" ]] || { echo "MISS: $r (needed for $DEVICE_NAME / $DEVICE_CPID)" >&2; exit 1; }
            echo "OK: $r"
          done
          chmod +x tools/darwin/*
          for t in pzb img4 gtar trustcache jq; do
            [[ -x "tools/darwin/$t" ]] || { echo "MISS: tool $t" >&2; exit 1; }
            echo "OK: tool: $t"
          done

      - name: Patch build.sh for case-insensitive DeviceClass
        run: |
          set -e
          cp build.sh build.sh.bak
          python3 << 'PY'
          import sys
          with open('build.sh', 'r') as f:
              content = f.read()
          orig = 'if item.get("Info", {}).get("DeviceClass") == board'
          repl = 'if item.get("Info", {}).get("DeviceClass", "").lower() == board.lower()'
          if orig not in content:
              print("WARNING: original pattern not found; build.sh may already be patched or changed")
              sys.exit(0)
          content = content.replace(orig, repl)
          with open('build.sh', 'w') as f:
              f.write(content)
          print("Patched build.sh: case-insensitive DeviceClass matching")
          PY
          diff -u build.sh.bak build.sh || true

      - name: Patch env.sh so a CI venv actually gets used
        # env.sh rebuilds PATH as:
        #   /usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin:/usr/local/bin:$NR_TOOLS:<inherited PATH>
        # /usr/bin comes first, so every bare `python3` call inside build.sh (including
        # the pyimg4-based wrap_kernel() heredoc) resolves to the system CLT/Homebrew
        # python3, never to the venv from "Setup Python venv" above - no matter how that
        # venv was activated before ./build.sh was invoked. That's exactly why the build
        # fails with "ModuleNotFoundError: No module named 'pyimg4'" right after the
        # AOP/ANE/AVE/ISP/GFX/SIO firmware is staged: it's the first bare `python3 <<EOF`
        # call in build.sh that actually needs a third-party package instead of stdlib.
        # Prepend $VIRTUAL_ENV/bin when a venv is active so build.sh picks it up; falls
        # back to the original resolution order when no venv is active (unchanged
        # behaviour for manual, non-CI runs).
        run: |
          set -e
          cp env.sh env.sh.bak
          python3 << 'PY'
          with open('env.sh', 'r') as f:
              content = f.read()
          orig = 'export PATH="/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin:/usr/local/bin:$NR_TOOLS${PATH:+:$PATH}"'
          repl = 'export PATH="${VIRTUAL_ENV:+$VIRTUAL_ENV/bin:}/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin:/usr/local/bin:$NR_TOOLS${PATH:+:$PATH}"'
          if orig not in content:
              print("WARNING: env.sh PATH line not found as expected; leaving untouched")
          else:
              content = content.replace(orig, repl)
              with open('env.sh', 'w') as f:
                  f.write(content)
              print("Patched env.sh: python3 now prefers an active venv over system python3")
          PY
          diff -u env.sh.bak env.sh || true

      - name: Replace irecovery with CI shim
        run: |
          set -e
          # build.sh uses $NR_TOOLS/irecovery (absolute path), not PATH.
          # We must replace the actual binary temporarily.
          mv tools/darwin/irecovery tools/darwin/irecovery.stock
          cat > tools/darwin/irecovery << SHIM
          #!/bin/bash
          if [[ "\$1" == "-q" ]]; then
            cat << 'INNER'
          PRODUCT: $DEVICE_PRODUCT
          MODEL: $DEVICE_BOARD
          CPID: $DEVICE_CPID
          MODE: DFU
          PWND: usbliter8
          ECID: 0000000000000000
          NAME: $DEVICE_NAME
          INNER
          else
            echo "irecovery shim: unsupported args: \$@" >&2
            exit 1
          fi
          SHIM
          chmod +x tools/darwin/irecovery
          echo "=== Shim test (via absolute path) ==="
          tools/darwin/irecovery -q

      - name: Pre-build debug — inspect BuildManifest
        # Uses the ipsw CLI (parameterized by ios_version) instead of a hardcoded pzb
        # URL, so this debug step reflects whatever build was actually selected for
        # this run instead of always showing the 23F84 / iOS 26.5.2 manifest.
        # Skipped when direct_ipsw_url is set: ios_version is meaningless on that path,
        # and this is non-gating debug output only (set +e below) — build.sh does its
        # own manifest validation later regardless.
        if: ${{ github.event.inputs.direct_ipsw_url == '' }}
        run: |
          set +e
          source .venv/bin/activate
          mkdir -p /tmp/bm_debug
          cd /tmp/bm_debug
          echo "=== Downloading BuildManifest via ipsw CLI ==="
          ipsw download ipsw --device "$DEVICE_PRODUCT" --build "${{ github.event.inputs.ios_version }}" --build-manifest --output .
          if [[ -f BuildManifest.plist ]]; then
            python3 << 'PY'
          import plistlib
          try:
              manifest = plistlib.loads(open("BuildManifest.plist", "rb").read())
              identities = manifest.get("BuildIdentities", [])
              print("=== BUILD IDENTITIES ===")
              for i, ident in enumerate(identities):
                  info = ident.get("Info", {})
                  print(f"Index {i}: DeviceClass={info.get('DeviceClass','N/A')} ProductType={info.get('ProductType','N/A')} BoardConfig={info.get('BoardConfig','N/A')} BuildNumber={info.get('BuildNumber','N/A')} RestoreBehavior={info.get('RestoreBehavior','N/A')}")
          except Exception as e:
              print(f"Failed to parse BuildManifest: {e}")
          PY
          else
            echo "WARNING: Could not download BuildManifest for debug inspection"
          fi
          cd -

      - name: Build bootchain
        env:
          # Passed via env: (not spliced straight into the script) since this is a
          # free-form URL string from a workflow_dispatch input.
          DIRECT_IPSW_URL: ${{ github.event.inputs.direct_ipsw_url }}
        run: |
          set -e
          # Now that env.sh (patched above) prepends $VIRTUAL_ENV/bin ahead of system
          # python3, activating the venv here actually determines which python3
          # build.sh's internal `python3 <<EOF` calls (e.g. wrap_kernel's pyimg4 use)
          # will resolve to.
          source .venv/bin/activate
          export PATH="$(pwd)/.venv/bin:$PATH"

          if [[ -n "$DIRECT_IPSW_URL" ]]; then
            # Bypasses build.sh's own `curl .../api.ipsw.me/v4/device/$PRODUCT` lookup —
            # the exact source of "no IPSW match for <product> selection <build>" when a
            # build is newer than ipsw.me's index. build.sh sets VERSION=unknown on this
            # path, which skips its manifest-build cross-check, but BUILD itself still
            # gets overwritten from the real downloaded BuildManifest either way, so the
            # packaged chain.info / BUILD-INFO.txt stay accurate.
            ARGS="--url $DIRECT_IPSW_URL"
          else
            ARGS="--build ${{ github.event.inputs.ios_version }}"
          fi
          ARGS="$ARGS --kernel ${{ github.event.inputs.kernel }}"
          ARGS="$ARGS --kpf-set ${{ github.event.inputs.kpf_set }}"
          if [[ "${{ github.event.inputs.with_fw }}" == "true" ]]; then
            ARGS="$ARGS --with-fw"
          else
            ARGS="$ARGS --no-fw"
          fi
          
          echo "=== SELECTED BUILD IDENTITY ==="
          echo "Device: $DEVICE_NAME ($DEVICE_PRODUCT / $DEVICE_BOARD / $DEVICE_CPID)"
          if [[ -n "$DIRECT_IPSW_URL" ]]; then
            echo "Source: direct URL (ipsw.me bypass) — $DIRECT_IPSW_URL"
          else
            echo "Build:  ${{ github.event.inputs.ios_version }}"
          fi
          echo "Kernel: ${{ github.event.inputs.kernel }}"
          echo "KPF-set: ${{ github.event.inputs.kpf_set }}"
          echo "With-FW: ${{ github.event.inputs.with_fw }}"
          echo "==========================="
          
          ./build.sh $ARGS

      - name: Inspect bootchain
        run: |
          set -e
          echo "=== Bootchain files ==="
          find bootchain -type f -print
          echo "=== Bootchain sizes ==="
          du -ah bootchain
          echo "=== chain.info ==="
          cat bootchain/*/chain.info || true

      - name: Package artifact
        run: |
          set -e
          BOOTCHAIN_DIR=$(find bootchain -maxdepth 1 -type d | tail -n +2 | head -1)
          if [[ -z "$BOOTCHAIN_DIR" ]]; then
            echo "ERROR: No bootchain directory found" >&2
            exit 1
          fi
          BUILD_NAME=$(basename "$BOOTCHAIN_DIR")
          echo "BOOTCHAIN_NAME=$BUILD_NAME" >> "$GITHUB_ENV"

          # chain.info's build= is always the real BuildNumber pulled from the
          # downloaded BuildManifest (build.sh overwrites it post-download on both
          # --build and --url paths) — prefer it over the raw ios_version input,
          # which is meaningless when direct_ipsw_url was used instead.
          RESOLVED_BUILD="$(awk -F= '$1=="build"{print $2}' "$BOOTCHAIN_DIR/chain.info" 2>/dev/null)"
          RESOLVED_BUILD="${RESOLVED_BUILD:-${{ github.event.inputs.ios_version }}}"
          echo "RESOLVED_BUILD_ID=$RESOLVED_BUILD" >> "$GITHUB_ENV"
          if [[ -n "${{ github.event.inputs.direct_ipsw_url }}" ]]; then
            SOURCE_LABEL="direct-url"
          else
            SOURCE_LABEL="ipsw.me"
          fi
          
          mkdir -p artifact/bootchain
          cp -R "$BOOTCHAIN_DIR"/* artifact/bootchain/
          
          cat > artifact/BUILD-INFO.txt << EOF
          Device: $DEVICE_NAME
          ProductType: $DEVICE_PRODUCT
          BoardConfig: $DEVICE_BOARD
          CPID: $DEVICE_CPID
          Chip: $DEVICE_CHIP
          Build: $RESOLVED_BUILD
          Source: $SOURCE_LABEL
          Kernel: ${{ github.event.inputs.kernel }}
          KPF-set: ${{ github.event.inputs.kpf_set }}
          With-FW: ${{ github.event.inputs.with_fw }}
          Runner: macos-15
          Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Repository: ${{ github.repository }}
          Commit: ${{ github.sha }}
          EOF
          
          echo "${{ github.sha }}" > artifact/source-commit.txt
          
          tar -czf "${DEVICE_SLUG}-ramdisk.tar.gz" -C artifact .
          
          echo "=== Final artifact ==="
          find artifact -type f
          du -ah artifact "${DEVICE_SLUG}-ramdisk.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEVICE_SLUG }}-ramdisk-${{ env.RESOLVED_BUILD_ID }}
          path: |
            artifact/
            ${{ env.DEVICE_SLUG }}-ramdisk.tar.gz
          if-no-files-found: error

      - name: Restore original files
        if: always()
        run: |
          # Restore original irecovery
          if [[ -f tools/darwin/irecovery.stock ]]; then
            mv -f tools/darwin/irecovery.stock tools/darwin/irecovery
            echo "Restored original irecovery"
          fi
          # Restore original build.sh
          if [[ -f build.sh.bak ]]; then
            mv -f build.sh.bak build.sh
            echo "Restored original build.sh"
          fi
          # Restore original env.sh
          if [[ -f env.sh.bak ]]; then
            mv -f env.sh.bak env.sh
            echo "Restored original env.sh"
          fi
