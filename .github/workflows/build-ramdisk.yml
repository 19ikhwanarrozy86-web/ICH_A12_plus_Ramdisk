name: Build A12/A13 SSH Ramdisk

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Target Apple device (e.g. iPhone12,1, iPhone11,8, iPad12,1)"
        required: true
        default: "iPhone12,1"
        type: choice
        options:
          - "iPhone12,1" # iPhone 11 (A13)
          - "iPhone12,3" # iPhone 11 Pro (A13)
          - "iPhone12,5" # iPhone 11 Pro Max (A13)
          - "iPhone12,8" # iPhone SE 2nd Gen (A13)
          - "iPhone11,8" # iPhone XR (A12)
          - "iPhone11,2" # iPhone XS (A12)
          - "iPhone11,6" # iPhone XS Max (A12)
          - "iPad12,1"   # iPad 9th Gen (A13)
          - "iPad11,3"   # iPad Air 3rd Gen (A12)
          - "iPad11,1"   # iPad mini 5th Gen (A12)
      ios_version:
        description: "iOS version to build (e.g. 16.5.1, 17.5.1, 18.0)"
        required: true
        type: string
      with_fw:
        description: "Include coprocessor firmwares (AOP/ANE/AVE/ISP/GFX/SIO/PMP)"
        required: true
        default: true
        type: boolean
      kernel:
        description: "Kernel mode"
        required: true
        default: "patched"
        type: choice
        options:
          - patched
          - stock
      kpf_set:
        description: "Kernel patchfinder profile"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - ios17
          - ios18
          - ios26
          - ios27
          - debugger+amfi
          - all

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install macOS build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew update
          brew install python@3 curl jq ipsw
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Verify build tools & resources
        shell: bash
        run: |
          set -euxo pipefail
          command -v hdiutil
          command -v diskutil
          command -v ipsw
          command -v jq
          python3 -c "import pyimg4, capstone; print('Python dependencies OK')"

          for f in \
            tools/darwin/irecovery \
            tools/darwin/pzb \
            tools/darwin/img4 \
            tools/darwin/gtar \
            tools/darwin/trustcache \
            tools/darwin/jq \
            tools/darwin/usbliter8_boot \
            resources/ssh.tar.gz \
            resources/sshtarlist.txt
          do
            test -e "$f" || { echo "Missing $f"; exit 1; }
          done

      - name: Build bootchain
        shell: bash
        env:
          TARGET_DEVICE: ${{ inputs.device }}
          IOS_VERSION: ${{ inputs.ios_version }}
          KERNEL_MODE: ${{ inputs.kernel }}
          WITH_FW: ${{ inputs.with_fw }}
          KPF_SET: ${{ inputs.kpf_set }}
        run: |
          set -euxo pipefail

          FW_FLAG="--with-fw"
          if [[ "$WITH_FW" != "true" ]]; then
            FW_FLAG="--no-fw"
          fi

          ./build.sh \
            --device "$TARGET_DEVICE" \
            --version "$IOS_VERSION" \
            "$FW_FLAG" \
            --kernel "$KERNEL_MODE" \
            --kpf-set "$KPF_SET"

      - name: Inspect generated bootchain
        shell: bash
        run: |
          set -euxo pipefail
          find bootchain -maxdepth 3 -type f -print | sort
          du -ah bootchain | sort -h | tail -50

      - name: Package artifact bundle
        shell: bash
        env:
          TARGET_DEVICE: ${{ inputs.device }}
          IOS_VERSION: ${{ inputs.ios_version }}
          KERNEL_MODE: ${{ inputs.kernel }}
          WITH_FW: ${{ inputs.with_fw }}
        run: |
          set -euxo pipefail

          mkdir -p artifact
          cp -R bootchain artifact/bootchain
          cp README.md artifact/README-upstream.md
          git rev-parse HEAD > artifact/source-commit.txt

          cat > artifact/BUILD-INFO.txt <<INFO
          Target Product: ${TARGET_DEVICE}
          iOS Version: ${IOS_VERSION}
          Kernel Mode: ${KERNEL_MODE}
          With Firmware: ${WITH_FW}
          Runner: macOS-15
          Build Mode: GitHub Actions CI
          Commit: $(git rev-parse HEAD)
          INFO

          ARCHIVE_NAME="${TARGET_DEVICE}-${IOS_VERSION}-ramdisk.tar.gz"
          tar -C artifact -czf "$ARCHIVE_NAME" .
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Upload bootchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            artifact/
          if-no-files-found: error
          retention-days: 14
