      - name: Package artifact
        run: |
          set -e
          BOOTCHAIN_DIR=$(find bootchain -maxdepth 1 -type d | tail -n +2 | head -1)
          if [[ -z "$BOOTCHAIN_DIR" ]]; then
            echo "ERROR: No bootchain directory found" >&2
            exit 1
          fi
          BUILD_NAME=$(basename "$BOOTCHAIN_DIR")
          echo "BOOTCHAIN_NAME=$BUILD_NAME" >> "$GITHUB_ENV"
          
          # Membuat folder penampung bersih
          mkdir -p artifact/bootchain
          
          # [STRATEGI BARU] Hanya menyalin file biner .img4 & .bin yang mutlak diperlukan untuk booting
          echo "=== Menyalin hanya file inti pembuat booting (Menghemat Ruang) ==="
          cp "$BOOTCHAIN_DIR"/*.img4 artifact/bootchain/ 2>/dev/null || true
          cp "$BOOTCHAIN_DIR"/*.bin artifact/bootchain/ 2>/dev/null || true
          cp "$BOOTCHAIN_DIR"/chain.info artifact/bootchain/ 2>/dev/null || true
          
          # Aturan penghapusan duplikasi Kernel berdasarkan pilihan input user
          if [[ "${{ github.event.inputs.kernel }}" == "patched" ]]; then
            rm -f artifact/bootchain/kernelcache.img4.stock
            echo "-> Menghapus kernel stock"
          else
            rm -f artifact/bootchain/kernelcache.img4.patched
            echo "-> Menghapus kernel patched"
          fi
          
          # Membuat file informasi pendukung ringan
          cat > artifact/BUILD-INFO.txt << EOF
          Device: iPhone 11
          ProductType: iPhone12,1
          BoardConfig: N104AP
          CPID: 0x8030
          Chip: A13 / T8030
          Build: ${{ github.event.inputs.ios_version }}
          Kernel: ${{ github.event.inputs.kernel }}
          With-FW: ${{ github.event.inputs.with_fw }}
          Runner: macos-15
          Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Repository: ${{ github.repository }}
          Commit: ${{ github.sha }}
          EOF
          
          echo "${{ github.sha }}" > artifact/source-commit.txt
          
          # Kompresi file final
          tar -czf iphone11-a13-ramdisk.tar.gz -C artifact .
          
          echo "=== Hasil Pembersihan Agresif ==="
          find artifact -type f
          du -ah artifact iphone11-a13-ramdisk.tar.gz
